<svg xmlns="http://w3.org" viewBox="0 0 850 260" width="100%">
  <!-- Estilos de Animação Padrão Aceitos pelo GitHub -->
  <style>
    @keyframes ondasMar {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(4px); }
    }
    @keyframes brilhoEstrela {
      0%, 100% { opacity: 0.2; }
      50% { opacity: 1; }
    }
    @keyframes correrPokemon {
      0% { transform: translateX(0px) scaleX(1); }
      45% { transform: translateX(250px) scaleX(1); }
      50% { transform: translateX(250px) scaleX(-1); }
      95% { transform: translateX(0px) scaleX(-1); }
      100% { transform: translateX(0px) scaleX(1); }
    }
    .ceu-brilho-1 { animation: brilhoEstrela 2s infinite ease-in-out; }
    .ceu-brilho-2 { animation: brilhoEstrela 3s infinite ease-in-out 0.5s; }
    .movimento-onda { animation: ondasMar 3s infinite ease-in-out; }
    .grupo-pokemon { animation: correrPokemon 12s infinite linear; }
  </style>

  <!-- Fundo do Céu Noturno -->
  <rect width="850" height="260" fill="#0d1117" rx="6" />

  <!-- O Céu de Contribuições (Simulação dos blocos piscando) -->
  <g transform="translate(30, 20)">
    <rect class="ceu-brilho-1" x="10" y="10" width="12" height="12" rx="2" fill="#0e4429" />
    <rect class="ceu-brilho-2" x="30" y="10" width="12" height="12" rx="2" fill="#39d353" />
    <rect class="ceu-brilho-1" x="50" y="10" width="12" height="12" rx="2" fill="#26a641" />
    <rect class="ceu-brilho-2" x="90" y="10" width="12" height="12" rx="2" fill="#39d353" />
    <rect class="ceu-brilho-1" x="150" y="10" width="12" height="12" rx="2" fill="#216e39" />
    <rect class="ceu-brilho-2" x="210" y="10" width="12" height="12" rx="2" fill="#39d353" />
    <rect class="ceu-brilho-1" x="270" y="10" width="12" height="12" rx="2" fill="#26a641" />
    <rect class="ceu-brilho-2" x="350" y="10" width="12" height="12" rx="2" fill="#39d353" />
    <rect class="ceu-brilho-1" x="430" y="10" width="12" height="12" rx="2" fill="#0e4429" />
    <rect class="ceu-brilho-2" x="510" y="10" width="12" height="12" rx="2" fill="#216e39" />
    <rect class="ceu-brilho-1" x="590" y="10" width="12" height="12" rx="2" fill="#39d353" />
    <rect class="ceu-brilho-2" x="670" y="10" width="12" height="12" rx="2" fill="#26a641" />
    <rect class="ceu-brilho-1" x="750" y="10" width="12" height="12" rx="2" fill="#39d353" />
    
    <rect class="ceu-brilho-2" x="20" y="26" width="12" height="12" rx="2" fill="#26a641" />
    <rect class="ceu-brilho-1" x="70" y="26" width="12" height="12" rx="2" fill="#216e39" />
    <rect class="ceu-brilho-2" x="120" y="26" width="12" height="12" rx="2" fill="#39d353" />
    <rect class="ceu-brilho-1" x="180" y="26" width="12" height="12" rx="2" fill="#0e4429" />
    <rect class="ceu-brilho-2" x="240" y="26" width="12" height="12" rx="2" fill="#39d353" />
    <rect class="ceu-brilho-1" x="310" y="26" width="12" height="12" rx="2" fill="#26a641" />
    <rect class="ceu-brilho-2" x="390" y="26" width="12" height="12" rx="2" fill="#39d353" />
    <rect class="ceu-brilho-1" x="470" y="26" width="12" height="12" rx="2" fill="#216e39" />
    <rect class="ceu-brilho-2" x="550" y="26" width="12" height="12" rx="2" fill="#39d353" />
    <rect class="ceu-brilho-1" x="630" y="26" width="12" height="12" rx="2" fill="#26a641" />
    <rect class="ceu-brilho-2" x="710" y="26" width="12" height="12" rx="2" fill="#0e4429" />
  </g>

  <!-- Camadas do Mar com Ondas -->
  <g class="movimento-onda">
    <rect x="0" y="110" width="850" height="150" fill="#1f6feb" />
    <rect x="0" y="135" width="850" height="125" fill="#58a6ff" />
    <rect x="0" y="150" width="850" height="110" fill="#c9d1d9" opacity="0.4" />
  </g>

  <!-- Areia da Praia Estável -->
  <rect x="0" y="165" width="850" height="95" fill="#e3b341" />
  <g fill="#c69026">
    <rect x="60" y="190" width="4" height="4" />
    <rect x="180" y="220" width="4" height="4" />
    <rect x="340" y="180" width="4" height="4" />
    <rect x="520" y="230" width="4" height="4" />
    <rect x="710" y="195" width="4" height="4" />
  </g>

  <!-- ANIMAÇÃO DOS POKÉMON CORRENDO E GIRANDO EM LOOP -->
  <g class="grupo-pokemon" transform="translate(150, 0)">
    <!-- BULBASAUR BRINCANDO -->
    <g transform="translate(0, 140) scale(1.6)">
      <!-- Bulbo -->
      <rect x="4" y="2" width="6" height="5" fill="#26a641" />
      <rect x="6" y="3" width="2" height="3" fill="#39d353" />
      <!-- Vinhas Pixeladas Simples saindo de trás -->
      <path d="M 2,4 Q -4,0 -2,-4" stroke="#216e39" stroke-width="1.5" fill="none" />
      <!-- Corpo -->
      <rect x="0" y="6" width="11" height="8" fill="#48cae4" />
      <rect x="2" y="8" width="2" height="2" fill="#0096c7" />
      <rect x="8" y="7" width="1" height="2" fill="#ba181b" /> <!-- Olho -->
      <rect x="1" y="14" width="2" height="2" fill="#0077b6" />
      <rect x="8" y="14" width="2" height="2" fill="#0077b6" />
    </g>

    <!-- CYNDAQUIL CORRENDO -->
    <g transform="translate(45, 138) scale(1.6)">
      <!-- Chaminha de Fogo (Efeito Piscando) -->
      <g class="ceu-brilho-2">
        <rect x="-2" y="4" width="3" height="4" fill="#ffb703" />
        <rect x="-1" y="2" width="1" height="3" fill="#fb8500" />
      </g>
      <!-- Corpo -->
      <rect x="1" y="5" width="5" height="9" fill="#03045e" />
      <rect x="6" y="6" width="6" height="8" fill="#fdf0d5" />
      <rect x="8" y="4" width="4" height="3" fill="#fdf0d5" />
      <rect x="12" y="6" width="2" height="2" fill="#fdf0d5" /> <!-- Focinho -->
      <rect x="9" y="5" width="1" height="1" fill="#000000" /> <!-- Olho -->
      <rect x="3" y="14" width="2" height="2" fill="#023e8a" />
      <rect x="8" y="14" width="2" height="2" fill="#d6ccc2" />
    </g>
  </g>
</svg>
